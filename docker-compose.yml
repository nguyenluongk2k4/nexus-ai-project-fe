services:
  # ---------------------------------------------------------------------------
  # Frontend Service (React + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_WS_URL=
        - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    container_name: nexusai-frontend
    env_file:
      - .env
    ports:
      - "3000:80"
    restart: always
    networks:
      - nexusai-network

networks:
  nexusai-network:
    external: true
